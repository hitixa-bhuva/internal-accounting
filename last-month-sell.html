    <script>
        function toggleDomainFields() {
            const checkbox = document.getElementById("invalidCheck");
            const domainFields = document.getElementById("domainFields");

            // Hide domain fields when checkbox is checked
            domainFields.style.display = checkbox.checked ? "none" : "flex";
        }


        // Run on page load in case JS loads after DOM
        toggleDomainFields();
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const deleteLinks = document.querySelectorAll('.deleteItem');

            deleteLinks.forEach(link => {
                link.addEventListener('click', function (e) {
                    e.preventDefault(); // Prevent default anchor behavior

                    Swal.fire({
                        title: 'Are you sure?',
                        text: "You won't be able to revert this!",
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: '#16c7f9',
                        cancelButtonColor: '#fc4438',
                        confirmButtonText: 'Yes, delete it!',
                        cancelButtonText: 'Cancel'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            // You can add your delete logic here
                            Swal.fire('Deleted!', 'Your item has been deleted.', 'success');
                        }
                    });
                });
            });
        });
    </script>
    <script>
        // Set default arrival date to today
        const arrivalInput = document.getElementById('arrivalDate');
        const renewInput = document.getElementById('renewDate');

        const today = new Date();
        const yearLater = new Date();
        yearLater.setFullYear(today.getFullYear() + 1);

        const formatDate = (date) => {
            return date.toISOString().split('T')[0];
        };

        arrivalInput.value = formatDate(today);
        renewInput.value = formatDate(yearLater);
    </script>
